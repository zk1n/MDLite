[package]
name = "mdlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[dependencies]
crop = { version = "=0.4.3", features = ["utf16-metric", "graphemes"] }
linkify = "=0.11.0"
smallvec = "1"
unicode-segmentation = "1.12"
encoding_rs = "0.8"
pulldown-cmark = { version = "=0.13.4", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_TextServices"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
roxmltree = "0.20"
windows-numerics = "0.3"
serde_json = "1"
sha2 = "=0.10.9"
pcre2-sys = "=0.2.10"
ignore = "=0.4.33"
same-file = "=1.0.6"


[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
